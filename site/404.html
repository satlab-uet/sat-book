<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#172a3a">
    <title>Không tìm thấy trang | SAT Book</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172a3a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #f1f6fa;
      }

      main {
        width: min(100%, 620px);
        padding: 52px;
        border-top: 6px solid #1769aa;
        background: white;
        box-shadow: 0 24px 64px rgba(23, 42, 58, 0.14);
      }

      p:first-child {
        margin: 0;
        color: #1769aa;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 14px;
        font-size: clamp(2.2rem, 8vw, 4rem);
        letter-spacing: -0.05em;
        line-height: 1;
      }

      p {
        color: #526572;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        padding: 12px 18px;
        border-radius: 6px;
        background: #1769aa;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Lỗi 404</p>
      <h1>Không tìm thấy trang</h1>
      <p>Đường dẫn có thể đã thay đổi hoặc không thuộc ấn bản hiện tại.</p>
      <a href="/sat-book/">Trở về trang sách</a>
    </main>
  </body>
</html>
